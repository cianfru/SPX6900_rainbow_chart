<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPX6900 — app screen POC</title>
<style>
  :root{
    --wall1:#eef0f4; --wall2:#e4e7ee; --ink:#0b0e14; --dim:#5a6376; --faint:#8a92a3; --live:#12b866;
    --tile1:#fbfcfd; --tile2:#dfe3ea; --tile3:#cdd3dd; --tileline:rgba(20,28,45,.16);
    --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  :root[data-theme="dark"]{
    --wall1:#0b0d13; --wall2:#070910; --ink:#eef2f8; --dim:#9aa4b6; --faint:#6b7486; --live:#37f7a0;
    /* tile material stays LIGHT in dark mode (like real iOS icons) so every glyph reads; only the
       wallpaper + labels go dark. */
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{ font-family:var(--mono); color:var(--ink);
    background:radial-gradient(120% 80% at 90% 108%, rgba(120,90,230,.10), transparent 55%), linear-gradient(180deg,var(--wall1),var(--wall2)); }
  /* faint rainbow arc bottom-right, like the mock */
  .wallarc{ position:fixed; right:-34%; bottom:-42%; width:135%; height:95%; pointer-events:none; opacity:.16; z-index:0; }
  :root[data-theme="dark"] .wallarc{ opacity:.20; }

  .screen{ position:relative; z-index:1; min-height:100dvh; display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 20px calc(env(safe-area-inset-bottom,0px) + 14px); }
  .head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .head .l{ display:flex; align-items:center; gap:9px; font-weight:700; font-size:13.5px; letter-spacing:-.01em; white-space:nowrap; }
  .head .l .dot{ width:23px;height:23px;border-radius:50%;flex:none;background:conic-gradient(#e5342f,#f2621b,#f0a915,#37d067,#12c2c2,#1f8fe0,#5b2a86,#e5342f); }
  .head .cur{ color:var(--live); }
  .head .r{ font-size:9.5px; letter-spacing:.13em; color:var(--faint); text-align:right; line-height:1.5; white-space:nowrap; }
  .head .r b{ color:var(--live); font-weight:600; }

  /* horizontal pager */
  .pager{ flex:1; display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch; margin:6px -20px 0; scrollbar-width:none; }
  .pager::-webkit-scrollbar{ display:none; }
  .page{ flex:0 0 100%; scroll-snap-align:center; padding:14px 20px 0;
    display:grid; grid-template-columns:repeat(4,1fr); grid-auto-rows:min-content; gap:20px 16px; align-content:start; }

  .app{ background:none; border:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:9px; }
  .app .tile{ width:100%; aspect-ratio:1; border-radius:24%; position:relative; overflow:hidden; isolation:isolate;
    background:linear-gradient(158deg,var(--tile1),var(--tile2) 56%,var(--tile3));
    box-shadow:0 10px 20px rgba(15,22,40,.24), 0 2px 4px rgba(15,22,40,.16), inset 0 1.5px 0 rgba(255,255,255,.85), inset 0 -8px 14px rgba(15,22,40,.07);
    border:1px solid var(--tileline); transition:transform .12s ease; }
  .app:active .tile{ transform:scale(.9); }
  /* the app tiles keep their own light 'material' in BOTH themes (like real iOS icons) — only the
     wallpaper darkens — so every icon stays legible. */
  /* the classic first-iPhone 'gel' reflection — sits ON TOP of everything (incl. drop-in icons) so a
     set of flat, differently-coloured icons all share one cohesive glossy shine. */
  .app .tile::before{ content:''; position:absolute; left:0; right:0; top:0; height:47%; z-index:4; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.08)); border-radius:24% 24% 50% 50%/30% 30% 100% 100%; }
  .app .tile svg{ position:absolute; inset:0; margin:auto; width:62%; height:62%; z-index:1; }
  .app .tile.full svg{ width:100%; height:100%; inset:0; }
  /* drop-in icon image: put a full square icon at public/icons/<key>.png and it replaces the SVG
     automatically (full-bleed, under the gel shine). Missing file → the <img> removes itself and the
     placeholder SVG shows. Generate FLAT coloured icons — the tile adds the glossy first-iPhone shine. */
  .app .tile .iconimg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:inherit; z-index:3; }
  .app .nm{ font-size:12px; font-weight:600; color:var(--ink); letter-spacing:-.01em; }

  /* page dots + hint */
  .foot{ display:flex; flex-direction:column; align-items:center; gap:12px; padding:14px 0 6px; }
  .dots{ display:flex; gap:9px; }
  .dots i{ width:9px;height:9px;border-radius:50%;background:var(--faint);opacity:.4; transition:.2s; }
  .dots i.on{ opacity:1;background:var(--live); }
  .hint{ font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); display:inline-flex; gap:8px; }

  /* dock */
  .dock{ margin-top:12px; padding:13px 12px; border-radius:30px; display:grid; grid-template-columns:repeat(4,1fr); gap:12px;
    background:rgba(120,130,150,.16); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.16); }
  :root[data-theme="dark"] .dock{ background:rgba(255,255,255,.06); }
  .dock .app{ gap:7px; }
  .dock .app .nm{ font-size:11px; color:var(--dim); }

  /* ── iOS folder: tap a section → it expands into a sub-window of its charts ── */
  .folderwrap{ position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:26px 24px; }
  .folderwrap.open{ display:flex; }
  .folderwrap .backdrop{ position:absolute; inset:0; opacity:0; transition:opacity .26s ease;
    background:rgba(228,231,238,.55); backdrop-filter:blur(20px) saturate(1.15); -webkit-backdrop-filter:blur(20px) saturate(1.15); }
  :root[data-theme="dark"] .folderwrap .backdrop{ background:rgba(6,9,15,.6); }
  .folderwrap.in .backdrop{ opacity:1; }
  .folder{ position:relative; z-index:1; width:100%; max-width:420px; text-align:center;
    transform:scale(.3); opacity:0; transform-origin:center 42%;
    transition:transform .32s cubic-bezier(.2,.85,.25,1), opacity .2s ease; }
  .folderwrap.in .folder{ transform:scale(1); opacity:1; }
  .folder h3{ color:var(--ink); font-size:21px; font-weight:700; letter-spacing:-.015em; margin-bottom:20px; }
  .folder .fgrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:22px 16px; }
  .folder .fhint{ margin-top:22px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
</style></head>

const appHTML = (nm,ic)=>`<button class="app" data-app="${ic}"><span class="tile${FULL.has(ic)?' full':''}">${I[ic]||I.gchart}<img class="iconimg" src="/icons/${ic}.png" alt="" onerror="this.remove()"></span><span class="nm">${nm}</span></button>`;
const pager=document.getElementById('pager');
pager.innerHTML = PAGES.map(pg=>`<div class="page">${pg.map(a=>appHTML(a[0],a[1])).join('')}</div>`).join('');
document.getElementById('dock').innerHTML = DOCK.map(a=>appHTML(a[0],a[1])).join('');

// ── iOS folder: tap a section app → expand into a sub-window of its charts ──
const fw=document.getElementById('folderwrap'), fgrid=document.getElementById('foldergrid'), ftitle=document.getElementById('foldertitle');
const NAMES={holders:'Holders',onchain:'On-chain',supply:'Supply',exchanges:'Exchanges',liquidity:'Liquidity',whales:'Whales',bridges:'Bridges',market:'Market',valuation:'Valuation',performance:'Performance',cost:'Cost Basis',survivors:'Survivors',races:'Races',composite:'Composite'};
let fopen=false;
function openFolder(key){
  const subs=SUB[key]; if(!subs) return;
  ftitle.textContent=NAMES[key]||key;
  fgrid.innerHTML=subs.map(s=>appHTML(s[0],s[1])).join('');
  fw.classList.add('open'); requestAnimationFrame(()=>fw.classList.add('in'));
  fopen=true; try{ history.pushState({folder:key},''); }catch(e){}
}
function closeFolder(){ if(!fopen) return; fopen=false; fw.classList.remove('in');
  setTimeout(()=>fw.classList.remove('open'),300); }
document.getElementById('fbackdrop').addEventListener('click',()=>{ if(fopen) history.back(); });
window.addEventListener('popstate',()=>{ if(fopen) closeFolder(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&fopen) history.back(); });
// tap delegation: a folder app opens its folder; everything else is a direct link (POC: no-op)
document.addEventListener('click',e=>{
  const btn=e.target.closest('.app'); if(!btn) return;
  const key=btn.getAttribute('data-app');
  if(SUB[key]){ openFolder(key); }
  // else: real build navigates to the destination; POC leaves it.
});
const dots=document.getElementById('dots');
dots.innerHTML = PAGES.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('');
const hint=document.getElementById('hint');
pager.addEventListener('scroll',()=>{ const i=Math.round(pager.scrollLeft/pager.clientWidth);
  [...dots.children].forEach((d,j)=>d.classList.toggle('on',j===i));
  hint.style.opacity = i>=PAGES.length-1 ? '0' : '1'; });

// theme: follow ?theme= or default light (POC)
const q=new URLSearchParams(location.search).get('theme');
if(q==='dark') document.documentElement.setAttribute('data-theme','dark');
</script>
</body></html>
