<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>SPX6900 · post control</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #05050e; color: #e2e8f0;
    font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { padding: 22px 24px 8px; border-bottom: 1px solid rgba(255,255,255,.08); }
  h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
  .sub { color: #64748b; font-size: 13px; margin-top: 4px; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 18px 24px 80px; }
  .bar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    background: #0b0b18; border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px; padding: 12px 14px; margin: 16px 0 8px;
  }
  input[type=password] {
    background: #05050e; border: 1px solid rgba(255,255,255,.14); color: #e2e8f0;
    border-radius: 8px; padding: 10px 12px; font-size: 14px; min-width: 240px;
  }
  button {
    background: #1e293b; color: #e2e8f0; border: 1px solid rgba(255,255,255,.14);
    border-radius: 8px; padding: 9px 14px; font-size: 13px; cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  button:hover { background: #334155; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: #2563eb; border-color: #3b82f6; }
  button.primary:hover { background: #3b82f6; }
  button.danger { background: #7f1d1d; border-color: #b91c1c; }
  button.danger:hover { background: #991b1b; }
  .status { font-size: 13px; color: #94a3b8; margin: 8px 2px; min-height: 18px; }
  .status.err { color: #f87171; }
  .status.ok { color: #4ade80; }
  .sched { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; font-size: 12px; }
  .chip { background: #0b0b18; border: 1px solid rgba(255,255,255,.10); border-radius: 999px; padding: 4px 10px; color: #94a3b8; }
  .chip b { color: #e2e8f0; }
  .grid {
    display: grid; gap: 16px; margin-top: 14px;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  }
  .card {
    background: #0b0b18; border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
  }
  .card.next { border-color: #3b82f6; box-shadow: 0 0 0 1px #3b82f6 inset; }
  .card.queued { border-color: #f59e0b; box-shadow: 0 0 0 1px #f59e0b inset; }
  .card img { width: 100%; display: block; background: #05050e; aspect-ratio: 1200/630; }
  .card .meta { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
  .card .id { font-size: 14px; font-weight: 700; }
  .badge { font-size: 10.5px; letter-spacing: .6px; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; }
  .badge.next { background: rgba(59,130,246,.18); color: #93c5fd; }
  .badge.queued { background: rgba(245,158,11,.18); color: #fcd34d; }
  .badge.video { background: rgba(168,85,247,.18); color: #d8b4fe; }
  .badge.image { background: rgba(148,163,184,.16); color: #cbd5e1; }
  .badge.portrait { background: rgba(56,189,248,.18); color: #7dd3fc; }
  .badge.landscape { background: rgba(100,116,139,.18); color: #94a3b8; }
  .card .actions { margin-left: auto; display: flex; gap: 6px; }
  .card .ptext {
    white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.5;
    color: #cbd5e1; padding: 10px 12px 14px; border-top: 1px solid rgba(255,255,255,.07);
  }
  .card .ptext .cc { display: block; margin-top: 6px; font-size: 11px; color: #475569; }
  a.home { color: #64748b; font-size: 12px; text-decoration: none; }

  /* Gate */
  #gate {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(80% 60% at 50% 0%, rgba(37,99,235,.12), #05050e 60%);
  }
  #gate .box {
    width: min(380px, 92vw); background: #0b0b18; border: 1px solid rgba(255,255,255,.10);
    border-radius: 16px; padding: 28px 26px; text-align: center;
  }
  #gate h2 { margin: 0 0 4px; font-size: 19px; }
  #gate p { margin: 0 0 18px; color: #64748b; font-size: 13px; }
  #gate form { display: flex; flex-direction: column; gap: 12px; }
  #app { display: none; }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>SPX6900 · post control</h2>
    <p>Enter the password to continue.</p>
    <form id="gateForm">
      <input id="gpw" type="password" placeholder="Password" autocomplete="current-password" autofocus />
      <button class="primary" type="submit">Unlock</button>
    </form>
    <div class="status" id="gateStatus"></div>
  </div>
</div>

<div id="app">
  <header>
    <h1>SPX6900 · post control <span style="color:#475569;font-size:13px">(hidden)</span></h1>
    <div class="sub">Preview every card and pick what posts next. Queue one for the scheduled run, or post it now. Pick nothing and the daily auto-rotation runs as normal.</div>
  </header>
  <div class="wrap">
    <div class="bar">
      <button id="refresh">↻ Refresh</button>
      <button id="clear" class="danger">Clear queue → auto</button>
      <span style="margin-left:auto"></span>
      <button id="lock">Lock</button>
    </div>
    <div class="status" id="status">Loading…</div>
    <div class="sched" id="sched"></div>
    <div class="grid" id="grid"></div>
    <p><a class="home" href="/">← back to site</a></p>
  </div>
</div>

<script>
const OWNER = "cianfru", REPO = "SPX6900_rainbow_chart", BRANCH = "main";
const QUEUE_PATH = "public/next-post.json", STATE_PATH = "public/post-state.json";
const $ = s => document.querySelector(s);
const status = (msg, cls = "") => { const e = $("#status"); e.textContent = msg; e.className = "status " + cls; };
const pwKey = "spx_control_pw";
let PW = "";
let QUEUED = null, NEXT = null, IDS = [], UPCOMING = [], TEXTS = {}, MEDIA = {}, ORIENT = {}, META = { postedToday: false };
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

// All privileged actions go through the password-gated serverless function.
async function action(body) {
  const r = await fetch("/api/control", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: PW, ...body }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || ("request failed (" + r.status + ")")); e.status = r.status; throw e; }
  return j;
}

// ---- Gate ----
async function unlock(pw, silent) {
  $("#gateStatus").textContent = silent ? "" : "Checking…";
  try {
    PW = pw;
    await action({ action: "verify" });
    localStorage.setItem(pwKey, pw);
    $("#gate").style.display = "none";
    $("#app").style.display = "block";
    refresh();
  } catch (e) {
    PW = "";
    if (!silent) $("#gateStatus").innerHTML = `<span style="color:#f87171">${e.message}</span>`;
    $("#gate").style.display = "flex";
    $("#app").style.display = "none";
  }
}
function lock() {
  PW = ""; localStorage.removeItem(pwKey);
  $("#app").style.display = "none"; $("#gate").style.display = "flex";
  $("#gpw").value = ""; $("#gateStatus").textContent = ""; $("#gpw").focus();
}
$("#gateForm").addEventListener("submit", e => { e.preventDefault(); unlock($("#gpw").value, false); });
$("#lock").onclick = lock;

// ---- Dashboard ----
async function loadState() {
  const raw = p => fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${p}?t=${Date.now()}`, { cache: "no-store" })
    .then(r => r.ok ? r.json() : null).catch(() => null);
  const [q, st] = await Promise.all([raw(QUEUE_PATH), raw(STATE_PATH)]);
  QUEUED = q && q.id ? q.id : null;
  const today = new Date().toISOString().slice(0, 10);
  const postedToday = st && st.lastPostedDate === today;
  NEXT = UPCOMING.length ? (postedToday ? (UPCOMING[1]?.id ?? UPCOMING[0].id) : UPCOMING[0].id) : null;
  return { postedToday, lastId: st?.lastId };
}

async function loadSchedule() {
  const r = await fetch("/api/schedule?days=8");
  if (!r.ok) throw new Error("schedule endpoint failed (" + r.status + ")");
  const j = await r.json();
  IDS = j.ids || []; UPCOMING = j.upcoming || []; TEXTS = j.texts || {}; MEDIA = j.media || {}; ORIENT = j.orient || {};
}

function renderSchedule(meta) {
  const chips = [];
  if (QUEUED) chips.push(`<span class="chip" style="border-color:#f59e0b"><b style="color:#fcd34d">queued:</b> ${QUEUED}</span>`);
  if (meta.postedToday) chips.push(`<span class="chip"><b>today:</b> already posted (${meta.lastId ?? "?"})</span>`);
  UPCOMING.slice(0, 6).forEach((u, i) => {
    const isNext = u.id === NEXT && !(meta.postedToday && i === 0);
    chips.push(`<span class="chip">${u.date.slice(5)} → <b>${u.id}</b>${isNext ? " ·next" : ""}</span>`);
  });
  $("#sched").innerHTML = chips.join("");
}

function card(id) {
  const isNext = id === NEXT, isQ = id === QUEUED, isVid = MEDIA[id] === "video";
  const isPortrait = ORIENT[id] === "portrait";
  const el = document.createElement("div");
  el.className = "card" + (isQ ? " queued" : isNext ? " next" : "");
  const mediaBadge = isVid ? '<span class="badge video">🎥 video</span>' : '<span class="badge image">🖼 image</span>';
  const orientBadge = isPortrait
    ? '<span class="badge portrait">📱 4:5</span>'
    : '<span class="badge landscape">🖥 landscape</span>';
  const shape = isPortrait ? "4:5 portrait" : "landscape";
  const cc = isVid ? `still preview · posts as a ~10s ${shape} video` : `posts as this static ${shape} image`;
  el.innerHTML = `
    <img loading="lazy" src="/api/og?post=${encodeURIComponent(id)}" alt="${id}" />
    <div class="meta">
      <span class="id">${id}</span>
      ${mediaBadge}
      ${orientBadge}
      ${isQ ? '<span class="badge queued">queued</span>' : isNext ? '<span class="badge next">next auto</span>' : ""}
      <span class="actions">
        <button data-q="${id}">Queue</button>
        <button class="primary" data-now="${id}">Post now</button>
      </span>
    </div>
    <div class="ptext">${esc(TEXTS[id] || "")}<span class="cc">${cc}</span></div>`;
  return el;
}

function renderGrid() {
  const g = $("#grid"); g.innerHTML = "";
  IDS.forEach(id => g.appendChild(card(id)));
}

async function queue(id) {
  status(id ? `Queuing "${id}"…` : "Clearing queue…");
  try {
    const r = await action(id ? { action: "queue", id } : { action: "clear" });
    // Reflect the server's authoritative state immediately — don't wait on the
    // CDN-cached raw read, which lags by minutes and made selections look stuck.
    QUEUED = r.queued || null;
    renderSchedule(META); renderGrid();
    status(QUEUED ? `Queued "${QUEUED}" for the next scheduled run.` : "Queue cleared — back to auto.", "ok");
  } catch (e) { handleErr(e); }
}

async function postNow(id) {
  if (!confirm(`Post "${id}" to X right now? (real post)`)) return;
  status(`Dispatching "${id}"…`);
  try {
    await action({ action: "postnow", id });
    status(`Posting "${id}" now — check the Actions tab / X in ~1 min. The scheduled run will skip today.`, "ok");
  } catch (e) { handleErr(e); }
}

function handleErr(e) {
  status(e.message, "err");
  if (e.status === 401) lock(); // password changed / invalid → re-gate
}

async function refresh() {
  try {
    await loadSchedule();
    META = await loadState();
    renderSchedule(META);
    renderGrid();
    status(`${IDS.length} cards. ${QUEUED ? `Queued: ${QUEUED}.` : "No override — auto rotation."}`, "ok");
  } catch (e) { status(e.message, "err"); }
}

$("#grid").addEventListener("click", e => {
  const q = e.target.closest("[data-q]"), n = e.target.closest("[data-now]");
  if (q) queue(q.dataset.q);
  if (n) postNow(n.dataset.now);
});
$("#refresh").onclick = refresh;
$("#clear").onclick = () => queue(null);

// On load: if a saved password verifies, skip the gate; otherwise show it.
const saved = localStorage.getItem(pwKey);
if (saved) unlock(saved, true);
</script>
</body>
</html>
