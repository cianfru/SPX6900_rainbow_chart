name: Milestone watcher

# Hourly: post to X only when SPX6900's market cap first passes a GIANT on the
# board (PEPE / SHIB / DOGE ATH caps, BTC market-cap levels…). Each rung fires
# once, ever. State persists in public/milestone-state.json.
# Manual runs default to dry-run (detect + render preview, post nothing).

on:
  # Hourly meme-price milestone auto-posting disabled 2026-08-15 — kept on-demand
  # via workflow_dispatch. Re-enable by uncommenting the schedule below.
  # schedule:
  #   - cron: "30 * * * *" # hourly, offset 30m from the band watcher (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Detect only, do not post or write state"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: milestone-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Watch milestones + maybe post
        run: node scripts/bot/milestone-watch.mjs
        env:
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

      - name: Commit milestone + post state if changed
        run: |
          # A milestone post records its own LANE in post-state.json (recordLanePost("milestone")); it
          # does NOT set lastPostedDate, so lanes fire independently and this does not suppress the daily
          # rotation (by design — see the lane model in CLAUDE.md). We commit the merged state here.
          if [[ -n "$(git status --porcelain public/milestone-state.json public/post-state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/milestone-state.json public/post-state.json
            git commit -m "chore: milestone state $(date -u +%FT%TZ)"
            git push || { for i in 1 2 3 4 5; do echo "push rejected, rebasing (attempt $i)"; git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" && git push && break; sleep $((i*3)); done; }
          else
            echo "No milestone/post-state change to commit"
          fi

      - name: Upload card preview (dry-run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-preview
          path: milestone-preview.png
          if-no-files-found: ignore
