name: Daily on-chain FIFO refresh (BigQuery)

# PRIMARY daily on-chain refresh (owner, 2026-07-27): reconstructs the FULL FIFO suite at DAILY
# granularity from an own append-only BigQuery table. The incremental append scans only the new
# date partitions (~a few GB/day, inside BigQuery's free 1 TB/mo), so Dune is untouched — the
# 2,500 Dune credits stay reserved for one-time work. The Dune pipeline (onchain-dune.yml) is now
# a manual BACKUP (schedule removed) so the two never both commit onchain.json.
#
# WIRED + WAITING: until the GCP_SA_KEY secret is set (and BigQuery's monthly 1 TB free tier has
# reset ~1 Aug), every run SKIPS CLEANLY (green no-op) via the "Gate" step below — no red failures.
# Add the secret + seed the table once (bq load from the raw-transfer CSV — free, no scan) and it
# goes live daily automatically. First seeded run backfills ~546 GB once (inside the free tier).

on:
  schedule:
    - cron: "37 6 * * *"    # ~06:37 UTC daily (after the 00:17 snapshot)
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write           # for google-github-actions/auth

concurrency:
  group: onchain-bigquery
  cancel-in-progress: false

env:
  GCP_PROJECT: goog-fltx
  BQ_DATASET: spx_onchain
  BQ_TABLE: eth_transfers
  SPX_TOKEN: "0xe0f63a424a4439cbe457d80e4f4b51ad25b2c56c"

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Gate — skip cleanly until GCP_SA_KEY is set
        id: gate
        env:
          KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "GCP_SA_KEY not set yet — pipeline is wired and waiting (add the secret + seed the table, and it goes live daily). Skipping cleanly."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - id: auth
        if: steps.gate.outputs.go == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - if: steps.gate.outputs.go == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure append table exists
        if: steps.gate.outputs.go == 'true'
        # Own append-only table in the user's project. Reading/exporting it later is cheap;
        # only the incremental append below scans the (large) public dataset.
        run: |
          bq --project_id="$GCP_PROJECT" mk --dataset --location=US "$GCP_PROJECT:$BQ_DATASET" 2>/dev/null || true
          bq --project_id="$GCP_PROJECT" query --use_legacy_sql=false --format=none \
            "CREATE TABLE IF NOT EXISTS \`$GCP_PROJECT.$BQ_DATASET.$BQ_TABLE\` (sender STRING, receiver STRING, time TIMESTAMP, value BIGNUMERIC)"

      - name: Incremental append (only new transfers → partition-pruned, cheap)
        if: steps.gate.outputs.go == 'true'
        # First run: table empty → COALESCE floors to 2000 → full backfill (~546 GB, one-time,
        # inside the 1 TB/mo free tier). Later runs: block_timestamp > last → only recent
        # date partitions scanned (a few GB).
        run: |
          bq --project_id="$GCP_PROJECT" query --use_legacy_sql=false --format=none \
            "INSERT INTO \`$GCP_PROJECT.$BQ_DATASET.$BQ_TABLE\` (sender, receiver, time, value)
             SELECT from_address, to_address, block_timestamp, CAST(value AS BIGNUMERIC)
             FROM \`bigquery-public-data.crypto_ethereum.token_transfers\`
             WHERE token_address = '$SPX_TOKEN'
               AND block_timestamp > (SELECT COALESCE(MAX(time), TIMESTAMP '2000-01-01 00:00:00 UTC')
                                      FROM \`$GCP_PROJECT.$BQ_DATASET.$BQ_TABLE\`)"

      - name: Export the table → transfers.csv (reading own table is cheap)
        if: steps.gate.outputs.go == 'true'
        run: |
          bq --project_id="$GCP_PROJECT" query --use_legacy_sql=false --format=csv --max_rows=5000000 \
            "SELECT sender, receiver, time, value FROM \`$GCP_PROJECT.$BQ_DATASET.$BQ_TABLE\` ORDER BY time" > transfers.csv
          echo "transfers rows: $(( $(wc -l < transfers.csv) - 1 ))"

      - name: Prices CSV (from the CI-cleaned price-history.json)
        if: steps.gate.outputs.go == 'true'
        run: |
          node -e '
            const fs=require("fs");
            let rows=[];
            try { const a=JSON.parse(fs.readFileSync("public/price-history.json","utf8"));
              const arr=Array.isArray(a)?a:(a.prices||a.data||[]);
              rows=arr.map(x=>[x.date??x[0],x.price??x[1]]).filter(([d,p])=>d&&p>0); } catch {}
            fs.writeFileSync("prices.csv","date,price\n"+rows.map(([d,p])=>d+","+p).join("\n")+"\n");
            console.log("price days:",rows.length);
          '

      - name: Run local FIFO engine → onchain.json + urpd.json (DAILY granularity)
        if: steps.gate.outputs.go == 'true'
        run: |
          node scripts/build-onchain-local.mjs \
            --transfers=transfers.csv --prices=prices.csv \
            --out=public/onchain.json --urpd=public/urpd.json --threshold=155 --daily

      - name: Sanity check (reconcile to the known extract)
        if: steps.gate.outputs.go == 'true'
        run: |
          node -e '
            const o=JSON.parse(require("fs").readFileSync("public/onchain.json","utf8"));
            const last=o.at(-1); console.log("latest:",JSON.stringify(last));
            if(!(last.holders>40000&&last.holders<60000)){console.error("holders off — expected ~49.5k");process.exit(1);}
            if(!(last.rp>0.3&&last.rp<0.8)){console.error("realized price off — expected ~0.53");process.exit(1);}
            console.log("reconciles: rp",last.rp,"holders",last.holders,"top100",last.top100);
          '

      - name: Commit if changed
        id: commit
        if: steps.gate.outputs.go == 'true'
        run: |
          DEPLOY_CHANGED=""
          [[ -n "$(git status --porcelain public/onchain.json public/urpd.json)" ]] && DEPLOY_CHANGED=1
          if [[ -n "$DEPLOY_CHANGED" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/onchain.json public/urpd.json
            git commit -m "chore: on-chain FIFO refresh (BigQuery) $(date -u +%F)"
            git push
          else
            echo "No change to commit"
          fi
          [[ -n "$DEPLOY_CHANGED" ]] && echo "deploy=true" >> "$GITHUB_OUTPUT" || echo "deploy=false" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
