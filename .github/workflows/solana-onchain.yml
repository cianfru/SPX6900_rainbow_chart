name: Daily SPX-on-Solana refresh (Dune daily_balances)

# The Solana sibling of onchain-dune.yml (ETH). Same LOGIC — pull only the DAILY DELTA from Dune
# (WHERE day >= last day in the archive), merge it, re-run the local reconstruction →
# public/solana-onchain.json — but the archive is a COMMITTED file, not a release asset. The ≥5k
# Solana cohort is tiny (~2 MB, and dune/out/*.csv are already tracked as provenance), so it lives
# in the repo: self-seeding, versioned, no manual `gh release` upload. ETH stays a release asset
# only because its 2.6M raw transfers (67 MB) can't sit in git.
#
# SEEDED: dune/out/spx6900_solana_balances.csv (2026-01-01 → 2026-08-03, the committed 2026 slice).
#   The daily delta appends forward from its last day. Holder AGES are floored at 2026-01-01 until
#   the full-history backfill lands (the 9 quarterly chunks in dune/spx6900_solana_balances.sql,
#   PHASE 2 — concat into this file to correct ages; a one-time step, not needed for the feed).
#
# CREDITS: only the daily DELTA touches Dune (~1 partition, a few hundred ≥5k rows → cheap execution
#   AND cheap result-read). The ≥5k filter is what keeps the read small (see the SQL header).
# SECRETS/VARS: DUNE_API_KEY (secret, shared with the ETH pipeline). Optional DUNE_SOLANA_QUERY_ID
#   (var) — set after run 1 logs the created query id, to reuse it instead of creating one each day.

on:
  schedule:
    - cron: "41 5 * * *"   # ~05:41 UTC daily (after onchain-dune at 05:23)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: solana-onchain
  cancel-in-progress: false

env:
  ARCHIVE: dune/out/spx6900_solana_balances.csv

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Guard — the committed archive must exist (never a silent full scan)
        run: |
          if [[ ! -s "$ARCHIVE" ]]; then
            echo "::error::Missing $ARCHIVE — the committed Solana seed. Restore it before running."
            exit 1
          fi
          echo "archive rows: $(( $(wc -l < "$ARCHIVE") - 1 ))"

      - name: Pull Dune daily delta → merge → rebuild residents
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_SOLANA_QUERY_ID: ${{ vars.DUNE_SOLANA_QUERY_ID }}
        run: node scripts/build-solana-dune-refresh.mjs --archive="$ARCHIVE"

      - name: Sanity check
        run: |
          node -e '
            const d=JSON.parse(require("fs").readFileSync("public/solana-onchain.json","utf8"));
            const n=d.wallets.length; console.log("residents:",n,"| excluded:",d.excluded,"| updated:",d.updated);
            if(!(n>500&&n<20000)){console.error("resident count off — expected ~2k");process.exit(1);}
          '

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain public/solana-onchain.json "$ARCHIVE")" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/solana-onchain.json "$ARCHIVE"
            git commit -m "chore: solana on-chain refresh $(date -u +%F) [skip deploy]"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push rejected (attempt $i) — rebasing on the latest main and retrying"
              git pull --rebase --autostash origin main || exit 1
              sleep $((i * 3))
            done
          else
            echo "No change to commit"
          fi
