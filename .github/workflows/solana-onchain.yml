name: Daily SPX-on-Solana refresh (free public RPC)

# The Solana sibling of onchain-dune.yml (ETH). The daily feed is KEYLESS + ZERO Dune credits: one
# getProgramAccounts call to a free public Solana RPC snapshots every SPX token account, sums by
# owner, keeps the ≥5k cohort, and APPENDS today's balances to the committed archive
# (dune/out/spx6900_solana_balances.csv). Holder AGE + net-FLOW build up FORWARD from the
# accumulating daily snapshots — the repo's "snapshot-forward" pattern (same as chain-wallets /
# cex-flow). The reconstruction (build-solana-onchain.mjs) then rebuilds public/solana-onchain.json.
#
# The archive is a COMMITTED file (not a release asset like ETH): the ≥5k cohort is tiny (~2 MB, and
# dune/out/*.csv are tracked as provenance), so it self-seeds from the repo. ETH stays a release
# asset only because its 2.6M raw transfers (67 MB) can't sit in git.
#
# SEEDED: dune/out/spx6900_solana_balances.csv — the FULL ≥5k history since launch (Dune
#   daily_balances, 2023-12-21 → seam). CURRENT residency = the latest dense RPC snapshot; holder AGE
#   = true first ≥5k day from the full history (so a long-quiet holder reads its real age, not 0).
#
# DUNE is now only the one-time history backfill / dormant fallback (build-solana-dune-refresh.mjs) —
#   the daily cron touches NO Dune. A point-in-time RPC can't reach the past, which is why the 2026
#   Dune base + the PHASE-2 backfill still supply the historical ages.
# SECRETS/VARS: none required (public node). Optional SOL_RPC (secret) — a free Helius/QuickNode URL
#   if the public node rate-limits the heavy getProgramAccounts; the script fails safe (won't
#   overwrite the archive) if it gets a short/refused response.

on:
  schedule:
    - cron: "41 5 * * *"   # ~05:41 UTC daily (after onchain-dune at 05:23)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: solana-onchain
  cancel-in-progress: false

env:
  ARCHIVE: dune/out/spx6900_solana_balances.csv

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Guard — the committed archive must exist (never a silent full scan)
        run: |
          if [[ ! -s "$ARCHIVE" ]]; then
            echo "::error::Missing $ARCHIVE — the committed Solana seed. Restore it before running."
            exit 1
          fi
          echo "archive rows: $(( $(wc -l < "$ARCHIVE") - 1 ))"

      - name: Snapshot ≥5k balances via public Solana RPC → merge → rebuild residents
        env:
          SOL_RPC: ${{ secrets.SOL_RPC }}   # optional free Helius/QuickNode URL; blank → public mainnet-beta
        run: node scripts/build-solana-rpc-snapshot.mjs --archive="$ARCHIVE"

      - name: Sanity check
        run: |
          node -e '
            const d=JSON.parse(require("fs").readFileSync("public/solana-onchain.json","utf8"));
            const n=d.wallets.length; console.log("residents:",n,"| excluded:",d.excluded,"| updated:",d.updated);
            if(!(n>500&&n<20000)){console.error("resident count off — expected ~2k");process.exit(1);}
          '

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain public/solana-onchain.json "$ARCHIVE")" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/solana-onchain.json "$ARCHIVE"
            git commit -m "chore: solana on-chain refresh $(date -u +%F) [skip deploy]"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push rejected (attempt $i) — rebasing on the latest main and retrying"
              git pull --rebase --autostash origin main || exit 1
              sleep $((i * 3))
            done
          else
            echo "No change to commit"
          fi
