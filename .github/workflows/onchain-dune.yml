name: Daily on-chain refresh (ETH Dune + Solana RPC + Base Alchemy)

# Hands-off weekly refresh with NO BigQuery / NO GCP — uses the Dune credits the account
# already has. The full raw-transfer history lives in a GitHub RELEASE ASSET (transfers.csv.gz);
# each run downloads it, pulls only the WEEKLY DELTA from Dune (cheap: ~17k rows, no 402),
# merges, re-runs the LOCAL FIFO engine → onchain.json + urpd.json, then re-uploads the grown
# archive. SEED ONCE before the first run (see below).
#
# CREDITS: only the WEEKLY DELTA touches Dune (~a few credits/run, ~tens/month — nowhere near the
# 2,500 budget). The SEED (full history) is a ONE-TIME step and does NOT run here automatically.
#
# 🔲 ONE-TIME SEED (owner) — pick the ZERO-CREDIT path:
#    • PREFERRED (0 Dune credits): re-run the FREE BigQuery extract (bigquery/spx6900_raw_transfers.sql,
#      546 GB inside BigQuery's free 1 TB/mo — NOT Dune) — or reuse the CSV you already have — then:
#        gzip -c full_transfers.csv > transfers.csv.gz
#        gh release create onchain-archive transfers.csv.gz -t "On-chain transfer archive" -n "FIFO base"
#    • ALT (Dune, ~6 credits one-time, watch the meter): run locally
#        node scripts/build-onchain-dune-refresh.mjs --archive=transfers.csv --seed
#      then gzip + `gh release create onchain-archive transfers.csv.gz …`.
#    This workflow FAILS fast if the asset is missing — it will NOT auto-seed / spend credits.
# 🔲 SECRETS/VARS: DUNE_API_KEY (secret). Optional DUNE_INCREMENTAL_QUERY_ID (var) — set after the
#    first run logs the created query id, to reuse it instead of creating a new one each week.

on:
  # PRIMARY daily on-chain refresh + SINGLE SOURCE OF TRUTH (owner, 2026-07-27). The full transfer
  # history lives as the GitHub release asset (transfers.csv.gz); each run pulls ONLY the incremental
  # Dune delta (WHERE evt_block_time >= last day), merges, and runs the local FIFO engine at DAILY
  # granularity (--daily, set in build-onchain-dune-refresh.mjs). Dune's "result read" bills by rows,
  # not runs, so daily ≈ weekly ≈ ~150-180 credits/mo (~7% of the 2,500 budget). BigQuery
  # (onchain-bigquery.yml) is dispatch-ONLY now — one-time reconstructions + emergency backup — so
  # the two can never both commit onchain.json.
  # THE SINGLE daily on-chain cron. ETH (Dune incremental → local FIFO) is the primary job; Solana
  # (keyless public RPC snapshot-forward) and Base (Alchemy ≥5k cohort delta) are folded in as
  # continue-on-error steps below, so all three chains refresh in ONE run / ONE commit / ONE deploy
  # instead of three staggered crons. A Solana or Base hiccup can never block the ETH commit + deploy.
  schedule:
    - cron: "23 5 * * *"   # ~05:23 UTC daily
  workflow_dispatch:
    inputs:
      full:
        description: "Base: force a full cohort rebuild from genesis (self-heal)"
        type: boolean
        default: false

permissions:
  contents: write           # release download/upload + commit

concurrency:
  group: onchain-dune
  cancel-in-progress: false

env:
  ARCHIVE_TAG: onchain-archive
  ARCHIVE_ASSET: transfers.csv.gz

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Download the transfer archive (release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download "$ARCHIVE_TAG" --pattern "$ARCHIVE_ASSET" --dir . 2>/dev/null; then
            echo "::error::No '$ARCHIVE_ASSET' on release '$ARCHIVE_TAG'. SEED it first — upload the full 2.6M-row extract (see the workflow header)."
            exit 1
          fi
          gunzip -f "$ARCHIVE_ASSET"
          echo "archive rows: $(( $(wc -l < transfers.csv) - 1 ))"

      - name: Pull Dune delta → merge → run FIFO engine
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_INCREMENTAL_QUERY_ID: ${{ vars.DUNE_INCREMENTAL_QUERY_ID }}
        run: node scripts/build-onchain-dune-refresh.mjs --archive=transfers.csv
      - name: Rebuild the city time-machine (weekly per-wallet balances)
        # rides the same merged archive — no extra pull; feeds the launch→today slider.
        # continue-on-error: a secondary transform must never block committing the core onchain.json.
        continue-on-error: true
        run: node scripts/build-city-timeline.mjs --spx=transfers.csv --out=public/spx-timeline.json
      - name: "Rebuild the city recap (weekly/monthly — new residents, tier upgrades)"
        # pure diff of the timeline just built — no data pull; feeds the City report card + panel
        continue-on-error: true
        run: node scripts/build-city-recap.mjs --timeline=public/spx-timeline.json --out=public/city-recap.json
      - name: Rebuild cohort survival (who still holds, by arrival era)
        # continue-on-error: secondary re-slice of the timeline — can't be allowed to block onchain.json
        continue-on-error: true
        run: node scripts/build-cohort-survival.mjs --in=public/spx-timeline.json --out=public/cohort-survival.json
      - name: Rebuild whale-cohort history (DAILY counts in each size cohort)
        # off the raw archive → real per-transfer timestamps, daily membership (finer than the weekly
        # timeline); feeds the "Whale Counts Over Time" chart. continue-on-error + raised heap (loads +
        # sorts the full ~2.6M-row archive) so it can't OOM-block the pipeline; weekly seed persists on failure.
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/build-whale-cohorts.mjs --transfers=transfers.csv --out=public/whale-cohort-history.json
      - name: Rebuild exit flow (DAILY departures split by profit/loss — who's selling, at what price)
        # straight off the raw archive → exact per-day exit, finer than the weekly timeline
        # continue-on-error: a failure here must never block the core onchain.json commit (weekly seed persists)
        continue-on-error: true
        run: node scripts/build-exit-flow.mjs --transfers=transfers.csv --prices=public/price-history.json --out=public/exit-flow.json
      - name: Rebuild smart-money cohort (DAILY, proven top-timers, aggregate + new qualifiers)
        # off the raw archive → real per-transfer timestamps, daily net-flow (finer than the weekly timeline)
        # continue-on-error + a raised heap (loads+sorts the full ~2.6M-row archive) so it can't OOM-block the pipeline
        continue-on-error: true
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/build-smart-money.mjs --transfers=transfers.csv --prices=public/price-history.json --out=public/smart-money.json

      - name: Sanity check (reconcile to the known extract)
        run: |
          node -e '
            const o=JSON.parse(require("fs").readFileSync("public/onchain.json","utf8"));
            const last=o.at(-1); console.log("latest:",JSON.stringify(last));
            if(!(last.holders>40000&&last.holders<60000)){console.error("holders off — expected ~49.5k");process.exit(1);}
            if(!(last.rp>0.3&&last.rp<0.8)){console.error("realized price off — expected ~0.53");process.exit(1);}
            console.log("reconciles: rp",last.rp,"holders",last.holders,"top100",last.top100);
          '

      - name: Re-upload the grown archive
        # continue-on-error: the ETH data is already computed + sanity-checked, so a transient GitHub
        # upload hiccup must not cost the day's commit + deploy. The merge is idempotent — if the archive
        # doesn't grow today, the next run re-pulls the same delta from the same cutoff and recomputes.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -f transfers.csv
          gh release upload "$ARCHIVE_TAG" "$ARCHIVE_ASSET" --clobber

      # ── Solana (folded in from the retired solana-onchain.yml) ─────────────────────────────────
      # Keyless public-RPC snapshot-forward: one getProgramAccounts call snapshots every SPX token
      # account, sums by owner, keeps the ≥5k cohort, appends to the committed archive, and rebuilds
      # public/solana-onchain.json. continue-on-error so a Solana hiccup never blocks the ETH commit.
      - name: Solana — public-RPC snapshot → merge → rebuild residents
        continue-on-error: true
        env:
          SOL_RPC: ${{ secrets.SOL_RPC }}   # optional free Helius/QuickNode URL; blank → public mainnet-beta
        run: |
          if [[ -s dune/out/spx6900_solana_balances.csv ]]; then
            node scripts/build-solana-rpc-snapshot.mjs --archive=dune/out/spx6900_solana_balances.csv
          else
            echo "::warning::Solana archive missing — skipping Solana refresh"
          fi

      # ── Base (folded in from the retired base-onchain.yml) ─────────────────────────────────────
      # Alchemy ≥5k cohort delta: pulls transfers since lastBlock, replays onto per-wallet balances,
      # updates the cohort (crossings/exits), rebuilds public/base-onchain.json. continue-on-error.
      - name: Base — Alchemy delta → replay → rebuild base-onchain.json
        continue-on-error: true
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: node scripts/build-base-alchemy.mjs ${{ (github.event.inputs.full == 'true') && '--full' || '' }}

      - name: Commit if changed
        id: commit
        run: |
          # ETH/site files drive the DEPLOY (the site + og cards read these). Solana/Base files are
          # bot-only (no site consumer), so they ride along in the same commit but don't force a deploy
          # on their own. COMMIT if ANY of them changed; DEPLOY only if an ETH/site file changed.
          ETH_FILES="public/onchain.json public/urpd.json public/urpd-history.json public/whales.json public/spx-timeline.json public/cohort-survival.json public/exit-flow.json public/smart-money.json public/city-recap.json public/whale-cohort-history.json"
          CHAIN_FILES="public/solana-onchain.json dune/out/spx6900_solana_balances.csv public/base-onchain.json dune/out/spx6900_base_cohort.csv"
          DEPLOY_CHANGED=""
          [[ -n "$(git status --porcelain $ETH_FILES)" ]] && DEPLOY_CHANGED=1
          if [[ -n "$(git status --porcelain $ETH_FILES $CHAIN_FILES)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add $ETH_FILES $CHAIN_FILES
            git commit -m "chore: on-chain refresh — ETH/Solana/Base $(date -u +%F)"
            # This job takes ~2-3 min; a human (or another cron) can push to main inside that window,
            # which used to reject our push with a non-fast-forward and fail the whole daily refresh.
            # We only touch generated files, so rebasing onto the newer main is always clean —
            # pull --rebase then push, retried a few times against a busy branch.
            for i in 1 2 3 4 5; do
              git push && break
              echo "push rejected (attempt $i) — rebasing on the latest main and retrying"
              git pull --rebase --autostash origin main || exit 1
              sleep $((i * 3))
            done
          else
            echo "No change to commit"
          fi
          [[ -n "$DEPLOY_CHANGED" ]] && echo "deploy=true" >> "$GITHUB_OUTPUT" || echo "deploy=false" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
