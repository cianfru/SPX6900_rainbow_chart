name: Weekly on-chain FIFO refresh

on:
  schedule:
    - cron: "23 5 * * 1"   # ~Mon 05:23 UTC (weekly; these metrics are slow-moving)
  workflow_dispatch: {}     # manual runs (use this to validate the first run)

permissions:
  contents: write

concurrency:
  group: onchain-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Refresh on-chain suite from Dune (raw transfers → local FIFO)
        # Executes the raw-transfer dump via the Dune API (~6 credits, token-filtered), then
        # replays it through the LOCAL FIFO engine → public/onchain.json + public/urpd.json.
        # Zero heavy compute on Dune. DUNE_RAW_TRANSFERS_QUERY_ID reuses a saved query if set,
        # else the query is created once (its id is logged — set the var to reuse it).
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_RAW_TRANSFERS_QUERY_ID: ${{ vars.DUNE_RAW_TRANSFERS_QUERY_ID }}
        run: node scripts/build-onchain-refresh.mjs
      - name: Sanity check (reconcile to the known extract)
        run: |
          node -e '
            const o = JSON.parse(require("fs").readFileSync("public/onchain.json","utf8"));
            const last = o.at(-1);
            console.log("latest:", JSON.stringify(last));
            if (!(last.holders > 40000 && last.holders < 60000)) { console.error("holder count off — expected ~49.5k"); process.exit(1); }
            if (!(last.rp > 0.3 && last.rp < 0.8)) { console.error("realized price off — expected ~0.53"); process.exit(1); }
            console.log("reconciles: rp", last.rp, "holders", last.holders, "top100", last.top100);
          '
      - name: Commit if changed
        id: commit
        run: |
          DEPLOY_CHANGED=""
          [[ -n "$(git status --porcelain public/onchain.json public/urpd.json)" ]] && DEPLOY_CHANGED=1
          if [[ -n "$DEPLOY_CHANGED" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/onchain.json public/urpd.json
            git commit -m "chore: on-chain FIFO refresh $(date -u +%F)"
            git push
          else
            echo "No change to commit"
          fi
          [[ -n "$DEPLOY_CHANGED" ]] && echo "deploy=true" >> "$GITHUB_OUTPUT" || echo "deploy=false" >> "$GITHUB_OUTPUT"

  # Redeploy so the fresh onchain.json/urpd.json reach the site + og.js card renders (the
  # GITHUB_TOKEN commit above can't trigger deploy.yml). Mirrors snapshot.yml's deploy job.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
