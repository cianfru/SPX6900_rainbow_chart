name: AEON notable-sale watcher

# Hourly: post to X when a genuinely notable Project AEON sale lands — a steal, a rare
# piece changing hands, or a trade well above what that rarity fetches.
#
# Sales come LIVE from Alchemy (getNFTSales), so this fires while the trade is still news
# rather than waiting for the daily Dune pull. Rarity/art come from public/aeon-rarity.json
# and "typical for this rarity" from aeon-market.json's fair model — both banked daily, so
# this job needs no Dune and no OpenSea.
#
# It posts on its OWN lane, so it never consumes the daily rotation's slot (see
# lanePostedToday/recordLanePost in posts.mjs). Still capped at one notable sale per day.
# Manual runs default to dry-run: detect + render the card, post nothing.

on:
  schedule:
    - cron: "23 */6 * * *" # every 6h at :23 (reduced from hourly — posts ~weekly, so 6h latency is fine)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Detect + render only, do not post"
        type: boolean
        default: true
      hours:
        description: "How far back to look for sales"
        type: string
        default: "168"
      probe:
        description: "Diagnose the Alchemy feed only — dumps the raw response, posts nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: aeon-sale-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Probe the Alchemy sales feed (diagnostic only)
        # The live feed returned 0 sales while Dune showed 3 in the same window, so the
        # response shape is in doubt. This dumps the RAW payload — with and without the
        # block filter — so the mismatch is visible rather than inferred.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe }}
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          ALCHEMY_NETWORK: ${{ vars.ALCHEMY_NETWORK }}
          AEON_CONTRACT: ${{ vars.AEON_CONTRACT }}
          PROBE_HOURS: ${{ inputs.hours || '168' }}
        run: node scripts/bot/aeon-live-sales.mjs --probe

      - name: Bank live sales (free — feeds the daily volume series and the market level)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        # Dune runs weekly; this keeps volume, sale counts and the MARKET LEVEL current in
        # between, and market level is what sets fair value for the listings verdict and the
        # alert threshold below. Never throws — a bad fetch leaves the bank as it was.
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          ALCHEMY_NETWORK: ${{ vars.ALCHEMY_NETWORK }}
          AEON_CONTRACT: ${{ vars.AEON_CONTRACT }}
        run: node scripts/build-aeon-live-bank.mjs

      - name: Watch for a notable AEON sale + maybe post
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        env:
          # Repo var AEON_SALE_DRY_RUN=1 keeps the schedule in watch-only mode. (Re-enabled
          # 2026-08-20 after the kill-switch: transfers→Alchemy, sales→Dune and OpenSea
          # listings are all live and verified again, so the watchers have fresh inputs.)
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || vars.AEON_SALE_DRY_RUN }}
          AEON_SALE_HOURS: ${{ inputs.hours || '168' }}
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          ALCHEMY_NETWORK: ${{ vars.ALCHEMY_NETWORK }}
          AEON_CONTRACT: ${{ vars.AEON_CONTRACT }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/bot/aeon-sale-watch.mjs

      - name: Watch for an AEON fire-sale listing + maybe post
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        # A live listing priced below what its rarity sells for → a buy-now card on X. Its own
        # lane (firesale), one/day, gated on a genuine steal. Same DRY toggle as the sale watcher.
        env:
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || vars.AEON_SALE_DRY_RUN }}
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          ALCHEMY_NETWORK: ${{ vars.ALCHEMY_NETWORK }}
          AEON_CONTRACT: ${{ vars.AEON_CONTRACT }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/bot/aeon-firesale-watch.mjs

      - name: Watch for a wallet SWEEP + maybe post
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.probe) }}
        # One wallet scooping ≥3 AEON in a few days → a card showing the haul. Its own lane
        # (aeonsweep), one/day, gated on a FRESH sweep. Same DRY toggle as the sale watcher.
        env:
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || vars.AEON_SALE_DRY_RUN }}
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          ALCHEMY_NETWORK: ${{ vars.ALCHEMY_NETWORK }}
          AEON_CONTRACT: ${{ vars.AEON_CONTRACT }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/bot/aeon-sweep-watch.mjs

      - name: Commit bank + sale + post state if changed
        run: |
          # aeon-sale-state.json / aeon-firesale-state.json remember what already fired;
          # aeon-firesale.json is the control-panel candidate; post-state.json carries each
          # lane's once-a-day record. All deploy-ignored (control-panel reads via raw).
          # Some of these only appear once their watcher first fires, so add ONLY the ones
          # that exist — `git add` aborts (exit 128) on a pathspec that matches no file.
          present=""
          for f in public/aeon-sale-state.json public/aeon-firesale-state.json public/aeon-firesale.json public/aeon-sweep-state.json public/post-state.json public/aeon-live-sales.json; do
            [ -e "$f" ] && present="$present $f"
          done
          if [[ -n "$present" && -n "$(git status --porcelain -- $present)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -- $present
            git commit -m "chore: aeon sale state $(date -u +%FT%TZ)"
            git push || { for i in 1 2 3 4 5; do echo "push rejected, rebasing (attempt $i)"; git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" && git push && break; sleep $((i*3)); done; }
          else
            echo "No sale/post-state change to commit"
          fi

      - name: Upload card preview (dry-run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeon-sale-preview
          path: aeon-sale-preview.png
          if-no-files-found: ignore
