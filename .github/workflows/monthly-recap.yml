name: Monthly recap

# MANUAL publish/preview for the monthly recap. The AUTO-post now rides the daily
# post-tweet.yml workflow: on the 1st of the month it fires the recap (via
# `recap-run.mjs --post`) at 08:00 ET instead of the daily rotation, so the 1st
# has exactly one post and the rotation resumes on the 2nd. This workflow stays
# for on-demand use — the control panel's "Post recap" button and re-posting a
# specific month — and for rendering a recap to the job log as a check.
# Review the recap LIVE on the hidden control panel (/control → Monthly recap),
# which renders the post + cards on demand. Run with post=true to ship; post=false
# just renders it to the job log and commits nothing.

on:
  workflow_dispatch:
    inputs:
      post:
        description: "Publish the recap post for real (otherwise just render it to the job log as a check)"
        type: boolean
        default: false
      month:
        description: "Month to recap as YYYY-MM (blank = the month that just ended)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: monthly-recap
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Render to log (or post)
        run: |
          MONTH_ARG=""
          if [ -n "${{ inputs.month }}" ]; then MONTH_ARG="--month=${{ inputs.month }}"; fi
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.post }}" = "true" ]; then
            node scripts/bot/recap-run.mjs --post $MONTH_ARG
          else
            # Sanity check only: prints the thread + char counts, writes nothing tracked.
            node scripts/bot/recap-run.mjs --dry-run $MONTH_ARG
          fi
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

      - name: Commit posted-state record
        if: always()
        run: |
          # Only --post writes recap-pending.json (posted:true) — the record of what
          # shipped + the double-post guard. Previews are reviewed live on /control,
          # so nothing else is committed here.
          if [[ -n "$(git status --porcelain public/recap-pending.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/recap-pending.json
            git commit -m "chore: recap posted $(date -u +%F)"
            git push
          else
            echo "Nothing to commit (preview/check run)"
          fi
