name: Daily supply snapshot

on:
  schedule:
    - cron: "17 0 * * *"   # ~00:17 UTC daily
  workflow_dispatch: {}     # allow manual runs

permissions:
  contents: write

concurrency:
  group: supply-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Take snapshot
        env:
          HOLDERSCAN_KEY: ${{ secrets.VITE_HOLDERSCAN_KEY }}
          # Optional: shadow-mode LLM copywriter for the "Notable today" signals.
          # Unset → the control panel shows labelled MOCK drafts. Set the secret to
          # get real OpenRouter drafts. The copywriter tries a free-model fallback
          # chain (multiple providers) so a single rate-limited free endpoint doesn't
          # kill the draft. OPENROUTER_MODEL (primary) / OPENROUTER_MODELS (whole
          # comma-separated chain) are optional overrides — both have sane defaults.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
          # Multi-chain holder count. Both keyless: Base via Blockscout, Solana via a
          # public Solana RPC (getProgramAccounts). Mints have defaults. SOL_RPC overrides
          # the public node if it rate-limits the heavy getProgramAccounts call.
          BASE_SPX: ${{ vars.BASE_SPX }}
          BASE_EXCLUDE: ${{ vars.BASE_EXCLUDE }}
          SOL_SPX: ${{ vars.SOL_SPX }}
          SOL_RPC: ${{ vars.SOL_RPC }}
        run: node scripts/snapshot.mjs
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain public/history.json public/signals.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/history.json public/signals.json
            git commit -m "chore: supply snapshot $(date -u +%F)"
            git push
          else
            echo "No change to commit"
          fi
