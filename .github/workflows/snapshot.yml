name: Daily supply snapshot

on:
  schedule:
    - cron: "17 0 * * *"   # ~00:17 UTC daily
  workflow_dispatch: {}     # allow manual runs

permissions:
  contents: write

concurrency:
  group: supply-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Take snapshot
        env:
          # HolderScan is retired — holders/realized-price/gini/tiers now come from our own FIFO
          # reconstruction (public/onchain.json), so no API key is needed here anymore.
          # Optional: shadow-mode LLM copywriter for the "Notable today" signals.
          # Unset → the control panel shows labelled MOCK drafts. Set the secret to
          # get real OpenRouter drafts. The copywriter tries a free-model fallback
          # chain (multiple providers) so a single rate-limited free endpoint doesn't
          # kill the draft. OPENROUTER_MODEL (primary) / OPENROUTER_MODELS (whole
          # comma-separated chain) are optional overrides — both have sane defaults.
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
          # Multi-chain holder count. Both keyless: Base via Blockscout, Solana via a
          # public Solana RPC (getProgramAccounts). Mints have defaults. SOL_RPC overrides
          # the public node if it rate-limits the heavy getProgramAccounts call.
          BASE_SPX: ${{ vars.BASE_SPX }}
          BASE_EXCLUDE: ${{ vars.BASE_EXCLUDE }}
          SOL_SPX: ${{ vars.SOL_SPX }}
          SOL_RPC: ${{ vars.SOL_RPC }}
          # CEX/LP/custody balances of the tagged addresses, keyless via a public ETH RPC
          # (eth_call balanceOf). Feeds the exchange-flow cards forward. ETH_RPC overrides the
          # default public node if it rate-limits. Soft-skips (null) on failure.
          ETH_RPC: ${{ vars.ETH_RPC }}
        run: node scripts/snapshot.mjs
      # ⚠ These three are SECONDARY re-slices of data already banked in history.json, so none of them
      # may block committing today's price. continue-on-error: an upstream outage (e.g. HolderScan
      # 402) can leave a null field today; if a builder chokes on it, its own JSON just forward-fills
      # while history.json + the deploy still go through. Green-but-stale is caught by the field-level
      # audit below (feed-health.json), which is exactly what that step exists for.
      - name: Extend multi-chain wallet series (no Dune, free)
        # Appends today's ETH/Base/Solana counts (just banked in history.json) onto the
        # validated historical bundle → public/chain-wallets.json. Zero credits, no Dune.
        continue-on-error: true
        run: node scripts/build-chain-wallets.mjs
      - name: Extend CEX/LP flow series (no Dune, free)
        # Splices today's CEX/LP/custody balances (just banked in history.json) onto the Dune
        # reconstruction baseline → public/cex-flow.json. Zero credits, keyless.
        continue-on-error: true
        run: node scripts/build-cex-flow.mjs
      - name: Rebuild valuation composite (no Dune, free)
        # Recomputes the weighted valuation composite from today's stats → public/valuation.json.
        # Pure transform of already-banked data (price + on-chain + sentiment). Keyless, zero cost.
        continue-on-error: true
        run: node scripts/build-valuation.mjs
      - name: Read the on-chain city noticeboard
        # Notes on buildings live on-chain (CityNotes.sol), not with us. This caches the logs into
        # public/city-notes.json so the site doesn't need an RPC key in the browser. Skips cleanly
        # while the contract is undeployed, and never blocks the snapshot — a missing noticeboard
        # costs nothing, a missing price snapshot costs a day of history.
        continue-on-error: true
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
        run: node scripts/build-city-notes.mjs
      - name: Audit every feed (field-level, not just file dates)
        # The failure that actually happens is a green workflow writing a file whose
        # date looks perfect while one field inside it stopped arriving — cexBal was
        # null for 53 straight days that way. This checks the fields the cards read,
        # every day, and banks the verdict for the control panel. Never blocks the
        # snapshot: a late upstream should not stop today's price from being recorded.
        continue-on-error: true
        run: node scripts/audit-feeds.mjs --warn --out=public/feed-health.json
      - name: Commit if changed
        id: commit
        run: |
          # history.json + chain-wallets.json are rendered by the deployed site + og.js
          # card, so a change to either must redeploy. signals.json is deploy-ignored.
          DEPLOY_CHANGED=""
          [[ -n "$(git status --porcelain public/history.json public/chain-wallets.json public/cex-flow.json public/valuation.json public/city-notes.json)" ]] && DEPLOY_CHANGED=1
          if [[ -n "$(git status --porcelain public/history.json public/signals.json public/chain-wallets.json public/cex-flow.json public/valuation.json public/city-notes.json public/feed-health.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/history.json public/signals.json public/chain-wallets.json public/cex-flow.json public/valuation.json public/city-notes.json public/feed-health.json
            git commit -m "chore: supply snapshot $(date -u +%F)"
            git push || { for i in 1 2 3 4 5; do echo "push rejected, rebasing (attempt $i)"; git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" && git push && break; sleep $((i*3)); done; }
          else
            echo "No change to commit"
          fi
          # This job pushes with GITHUB_TOKEN, whose commits CANNOT trigger deploy.yml
          # (GitHub's recursion guard). So signal the deploy job below to redeploy.
          [[ -n "$DEPLOY_CHANGED" ]] && echo "deploy=true" >> "$GITHUB_OUTPUT" || echo "deploy=false" >> "$GITHUB_OUTPUT"

  # Redeploy so the fresh history.json reaches the deployed site + the og.js card
  # renders (control panel). Needed because the GITHUB_TOKEN snapshot commit above
  # can't trigger deploy.yml. Mirrors deploy.yml; shares its concurrency group so the
  # two never deploy at once. Only runs when history.json actually changed (~1/day).
  deploy:
    needs: snapshot
    if: needs.snapshot.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # the just-pushed snapshot commit (not the trigger SHA)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
