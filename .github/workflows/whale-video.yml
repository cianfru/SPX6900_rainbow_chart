name: Whale cycle videos

# On-demand render of the whale cycle videos — the MOSAIC (every whale as a square, mood-bands
# breathing) and the SPECTRUM analyzer (10 size cohorts as equalizer bars). Trigger from the GitHub
# mobile app (Actions → this workflow → Run workflow); both MP4s come back as downloadable artifacts.
# Reads the committed spx-timeline.json + onchain.json, stitches frames with the bundled ffmpeg-static.

on:
  workflow_dispatch:
    inputs:
      fps:
        description: "frames per second (higher = faster playback)"
        type: string
        default: "8"
      hold:
        description: "frames to hold on 'today' at the end"
        type: string
        default: "14"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # spx-timeline.json now lives behind the data wall (private store, not the public repo), so pull it
      # back from KV before rendering. Needs KV_REST_API_URL/TOKEN as Actions secrets.
      - name: Pull spx-timeline from the private store (KV)
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: node scripts/pull-private-feed.mjs --key=spx-timeline --out=public/spx-timeline.json
      - name: Render + stitch the mosaic video
        run: node tools/render-whale-mosaic-video.mjs --fps=${{ inputs.fps }} --hold=${{ inputs.hold }}
      - name: Render + stitch the spectrum video
        run: node tools/render-whale-spectrum-video.mjs --fps=${{ inputs.fps }} --hold=${{ inputs.hold }}
      - name: Upload the MP4s
        uses: actions/upload-artifact@v4
        with:
          name: whale-cycle-videos
          path: |
            out/whale-mosaic-cycle.mp4
            out/whale-spectrum.mp4
          if-no-files-found: error
          retention-days: 14
