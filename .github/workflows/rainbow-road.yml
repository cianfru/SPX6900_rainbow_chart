name: Rainbow Road (render on demand)

# Renders the OutRun "Rainbow Road" video ON DEMAND — triggered by the control-panel button (or a
# manual dispatch). No schedule, no band-watching (band-watch.mjs owns that; the owner watches daily).
# It renders X-optimised clips and publishes them to the stable 'rainbow-road-latest' release so the
# control panel can hand back a download link. Nothing is ever auto-posted.

on:
  workflow_dispatch:
    inputs:
      format:
        description: "Aspect: vertical (9:16), square (1:1), wide (16:9), or all"
        type: choice
        options: [vertical, square, wide, all]
        default: vertical
      seconds:
        description: "Length in seconds"
        type: string
        default: "30"
      announce:
        description: "Show the 'TO BE CONTINUED' finish card at the end"
        type: boolean
        default: true
      sound:
        description: "Add the synthwave + engine soundtrack"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: rainbow-road
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # the renderer resolves ffmpeg via `python3 -c "import imageio_ffmpeg..."` (same as local)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install imageio-ffmpeg

      - name: Render Rainbow Road
        run: >-
          node scripts/bot/rainbow-road-run.mjs
          --formats=${{ inputs.format }}
          --seconds=${{ inputs.seconds }}
          ${{ inputs.announce && '' || '--no-announce' }}
          ${{ inputs.sound && '' || '--mute' }}

      - name: Upload clips (Actions artifact)
        if: ${{ hashFiles('out/*.mp4') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: rainbow-road-clips
          path: out/*.mp4
          if-no-files-found: ignore

      - name: Publish clips to the stable release (download links)
        if: ${{ hashFiles('out/*.mp4') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view rainbow-road-latest >/dev/null 2>&1 \
            || gh release create rainbow-road-latest --title "Rainbow Road — latest render" --notes "On-demand renders from the control panel. Review + post manually."
          gh release upload rainbow-road-latest out/*.mp4 --clobber
