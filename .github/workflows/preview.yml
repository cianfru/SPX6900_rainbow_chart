name: Preview Deploy (terminal branch)

# A PREVIEW deploy of the terminal-redesign branch — same pipeline as deploy.yml
# but WITHOUT --prod, so it lands on a throwaway *.vercel.app preview URL and never
# touches the production alias (spx6900rainbow.xyz). Lets the design be reviewed on
# the real app without shipping. Reuses the existing VERCEL_* repo secrets.

on:
  push:
    branches: [claude/spx6900-terminal-phase-2-8joqzw]
  workflow_dispatch: {}

concurrency:
  group: vercel-preview-terminal
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel project settings (preview)
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build (frontend + api functions)
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy prebuilt output to a PREVIEW url + stable alias
        run: |
          URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "preview url: $URL"
          echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"
          # Point a STABLE, bookmarkable *.vercel.app alias at this deploy so the review
          # URL never changes between pushes. Non-fatal: if the alias name is taken or
          # aliasing fails, the unique deploy URL above still works. Production
          # (spx6900rainbow.xyz) is NEVER aliased here — this only ever touches the
          # dedicated preview subdomain.
          ALIAS="${PREVIEW_ALIAS:-spx6900-terminal.vercel.app}"
          if vercel alias set "$URL" "$ALIAS" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"; then
            echo "aliased to: https://$ALIAS"
          else
            echo "alias step failed (name taken?) — use the unique URL above"
            ALIAS=""
          fi
          {
            echo "## 🌈 Terminal preview (branch — production untouched)"
            echo ""
            if [ -n "$ALIAS" ]; then
              echo "**Stable URL (bookmark this): https://$ALIAS**"
              echo ""
              echo "- Gallery: https://${ALIAS}/?view=charts"
              echo "- A chart: https://${ALIAS}/?chart=picycle"
              echo "- Project Aeon: https://${ALIAS}/?view=aeon"
              echo "- Landing: https://${ALIAS}/?view=next"
              echo ""
            fi
            echo "This-deploy URL: **$URL**"
            echo ""
            echo "> Private by default (Vercel Deployment Protection). Sign in to Vercel to view."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
