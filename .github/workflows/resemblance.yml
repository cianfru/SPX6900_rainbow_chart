# STUDY (run on demand): which coin's trajectory best rhymes with SPX6900's at the same
# age? Scans a broad candidate basket (majors + L1s + alts, beyond the memecoins) via
# CryptoCompare and ranks by same-age growth multiple + curve shape. Prints a table to the
# log and commits public/resemblance.json so the result persists. NOT wired to any card —
# it's a one-off study to PICK the best-matching peer, then we build that peer's card.
name: Find resemblance (study)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Scan candidates (CryptoCompare)
        run: node scripts/find-resemblance.mjs
      - name: Commit the ranking
        run: |
          if [[ -n "$(git status --porcelain public/resemblance.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/resemblance.json
            git commit -m "chore: resemblance study ranking"
            git push
          else
            echo "no change"
          fi
