# FOUNDATION: bank the peer coins' full DAILY price history, age-indexed since each coin's
# launch, into public/alt-history.json — the MAJORS (BTC/ETH/SOL, the same-age / what-came-
# next comparison peers) + memecoins (DOGE/PEPE/SHIB). DAILY (not thinned) so peaks/ATHs are
# exact — the bundled ~3-day src series erased sharp tops (SOL's $295 Jan-25 ATH → ~$220).
# Sourced from CryptoCompare daily (needs CRYPTOCOMPARE_KEY; allowlist-blocked from the dev
# sandbox but reachable from CI). Deep history is ~static, so monthly is plenty. RUN ONCE via
# "Run workflow" to populate, then monthly keeps the tail fresh.
name: Build peer price history (daily)
on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 2 * *"   # 06:37 UTC on the 2nd of each month
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Fetch memecoin age history (CryptoCompare)
        env:
          CRYPTOCOMPARE_KEY: ${{ secrets.CRYPTOCOMPARE_KEY }}
        run: node scripts/build-alt-history.mjs
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain public/alt-history.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/alt-history.json
            git commit -m "chore: bank memecoin age history"
            git push
          else
            echo "no change"
          fi
