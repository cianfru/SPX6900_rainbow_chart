name: Band watcher

# Hourly: post to X only when SPX6900 crosses INTO a marquee band
# (Fire Sale / BUY / SELL / Max Bubble). State persists in public/band-state.json.
# Manual runs default to dry-run (detect + render preview, post nothing).

on:
  schedule:
    - cron: "0 * * * *" # hourly, on the hour (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Detect only, do not post or write state"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: band-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Watch bands + maybe post
        run: node scripts/bot/band-watch.mjs
        env:
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

      - name: Commit band + post state if changed
        run: |
          # post-state.json is also written when a band alert posts, so the daily
          # rotation sees the day's slot is taken (one post per day across the bot).
          if [[ -n "$(git status --porcelain public/band-state.json public/post-state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/band-state.json public/post-state.json
            git commit -m "chore: band state $(date -u +%FT%TZ)"
            git push || { for i in 1 2 3 4 5; do echo "push rejected, rebasing (attempt $i)"; git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" && git push && break; sleep $((i*3)); done; }
          else
            echo "No band/post-state change to commit"
          fi

      - name: Upload card preview (dry-run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandchange-preview
          path: bandchange-preview.png
          if-no-files-found: ignore
