name: Post to X

# Daily SPX6900 rainbow snapshot to X (with the rainbow chart card).
# Manual runs default to dry-run (renders the card, posts nothing).
# Scheduled runs post for real — but only if the four X_* secrets are set;
# otherwise post.mjs auto-falls back to dry-run.

on:
  schedule:
    # Target 08:00 America/New_York (Eastern — the bulk of the audience) year-round.
    # GitHub cron is UTC-only and has NO daylight-saving handling, so register BOTH
    # offsets and let the "Gate to 08:00 ET" step below post on only the one that
    # matches the current EDT/EST state (the other is skipped). The once-per-day
    # guard in post.mjs is a second backstop against a double-post.
    - cron: "0 12 * * *" # 08:00 ET while EDT (Mar–Nov) — 12:00 UTC
    - cron: "0 13 * * *" # 08:00 ET while EST (Nov–Mar) — 13:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, do not post"
        type: boolean
        default: true
      check:
        description: "Auth check only (verify credentials, no post)"
        type: boolean
        default: false
      verify_media:
        description: "Upload-only test: send the card to X, print media_id, never tweet (pick a post_id below)"
        type: boolean
        default: false
      no_media:
        description: "Post text only, no image (cost A/B test)"
        type: boolean
        default: false
      post_id:
        # Free-form so ANY card id dispatches (the control panel posts every card in
        # the grid). A fixed `choice` list drifted out of date and 422'd new cards
        # (firesalerally, underwater, …). "auto" = the daily rotation; else a card id.
        description: "Which topic to publish (auto = daily rotation; else a card id, e.g. firesalerally)"
        type: string
        default: auto

permissions:
  contents: write

concurrency:
  group: post-to-x
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      # DST gate: a scheduled run proceeds only if its cron is the right one for the
      # CURRENT Eastern offset (12:00 UTC during EDT, 13:00 UTC during EST) — so the
      # post always lands at ~08:00 ET. Manual (workflow_dispatch) runs always proceed.
      - name: Gate to 08:00 ET (DST-aware)
        id: gate
        env:
          EVT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
        run: |
          node -e '
            if (process.env.EVT !== "schedule") { console.log("proceed=true"); process.exit(0); }
            const edt = new Date().toLocaleString("en-US", { timeZone: "America/New_York", timeZoneName: "short" }).includes("EDT");
            const want = edt ? "0 12 * * *" : "0 13 * * *";
            console.log("proceed=" + (process.env.SCHED === want ? "true" : "false"));
          ' >> "$GITHUB_OUTPUT"
          echo "event=$EVT schedule='$SCHED' -> $(tail -1 "$GITHUB_OUTPUT")"

      - uses: actions/checkout@v5
        if: steps.gate.outputs.proceed == 'true'

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.proceed == 'true'
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.proceed == 'true'

      # On the 1st of the month the monthly recap takes this slot INSTEAD of the
      # daily rotation (so the 1st has exactly one post — the recap — and the
      # rotation resumes on the 2nd), fired at the same 08:00 ET time via the same
      # cron + gate. Any manual/dry/check/override run still exercises the daily
      # path (the recap is previewed/tested via the Monthly recap workflow).
      - name: Build + post
        if: steps.gate.outputs.proceed == 'true'
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ -z "${DRY_RUN}${BOT_CHECK}${BOT_VERIFY_MEDIA}${BOT_NO_MEDIA}${BOT_POST}${BOT_FORCE}" ]; then
            echo "== 1st of the month → posting the monthly recap (not the daily rotation) =="
            node scripts/bot/recap-run.mjs --post
          else
            node scripts/bot/post.mjs
          fi
        env:
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
          BOT_CHECK: ${{ (github.event_name == 'workflow_dispatch' && inputs.check) && '1' || '' }}
          BOT_VERIFY_MEDIA: ${{ (github.event_name == 'workflow_dispatch' && inputs.verify_media) && '1' || '' }}
          BOT_NO_MEDIA: ${{ (github.event_name == 'workflow_dispatch' && inputs.no_media) && '1' || '' }}
          # Manual runs are intentional, so they bypass the once-per-day guard
          # (the guard exists to stop the scheduled cron from double-posting).
          BOT_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          BOT_POST: ${{ (github.event_name == 'workflow_dispatch' && inputs.post_id != 'auto') && inputs.post_id || '' }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

      - name: Commit post state (queue consume + once-per-day guard)
        if: always() && steps.gate.outputs.proceed == 'true'
        run: |
          if [[ -n "$(git status --porcelain public/next-post.json public/post-state.json public/daily-band-state.json public/recap-pending.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/next-post.json public/post-state.json public/daily-band-state.json public/recap-pending.json
            git commit -m "chore: post state $(date -u +%F)"
            git push
          else
            echo "No post-state change to commit"
          fi

      - name: Upload card preview
        if: always() && steps.gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: card-preview
          path: bot-preview.png
          if-no-files-found: ignore
