name: Project Aeon NFT banker

on:
  schedule:
    - cron: "37 1 * * *"   # ~01:37 UTC daily (after the supply snapshot)
  workflow_dispatch: {}     # allow manual runs

permissions:
  contents: write

concurrency:
  group: aeon-banker
  cancel-in-progress: false

jobs:
  aeon:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Bank Aeon floor / owners / supply (Alchemy NFT API)
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          ALCHEMY_NETWORK: ${{ vars.ALCHEMY_NETWORK }}   # optional (default eth-mainnet)
          AEON_CONTRACT: ${{ vars.AEON_CONTRACT }}        # optional override
        run: node scripts/build-aeon.mjs
      - name: Compute trait rarity (once — traits are immutable)
        # Skips automatically if public/aeon-rarity.json already exists (add --force to re-pull).
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          ALCHEMY_NETWORK: ${{ vars.ALCHEMY_NETWORK }}
          AEON_CONTRACT: ${{ vars.AEON_CONTRACT }}
        run: node scripts/build-aeon-rarity.mjs
      - name: Fetch active listings × rarity (OpenSea)
        # Soft-skips without OPENSEA_KEY. Daily — listings change constantly.
        env:
          OPENSEA_KEY: ${{ secrets.OPENSEA_KEY }}
          AEON_CONTRACT: ${{ vars.AEON_CONTRACT }}
          AEON_OS_SLUG: ${{ vars.AEON_OS_SLUG }}       # optional (else resolved from the contract)
        run: node scripts/build-aeon-listings.mjs
      # Dune is the ONLY metered thing in this workflow, so it runs WEEKLY while everything
      # else here stays daily. What it feeds — holder age, concentration, holder flow, the
      # 180-day fair model, trader P&L — moves in months, not days. The genuinely timely
      # surfaces no longer depend on it: floor/owners/supply come from Alchemy in the step
      # above, and notable sales come from Alchemy live in aeon-sale-watch.yml (hourly).
      # Daily was the right call only while the sale alert rode this pull.
      - name: Is it the weekly Dune day?
        id: dow
        run: echo "day=$(date -u +%u)" >> "$GITHUB_OUTPUT"

      - name: Refresh SALES from Dune (weekly — Monday)
        # Re-pulls the entire transfer + sale history (tiny for a 3,333 collection → a few
        # credits, no timeout). Soft-skips without DUNE_API_KEY; soft-fails on any Dune hiccup
        # so the floor/owners banker stays green (reconstructions then use the committed CSVs).
        # Weekly is enough: the recent tail is already carried free by the Alchemy bank, so
        # this pull only has to keep the deep full-history reconstruction (trader P&L, cost
        # basis, MVRV) current. Monday on the schedule; a manual dispatch always runs it.
        if: steps.dow.outputs.day == '1' || github.event_name == 'workflow_dispatch'
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          AEON_SALES_QUERY_ID: ${{ vars.AEON_SALES_QUERY_ID }}           # optional (else created + logged)
        run: node scripts/build-aeon-dune-refresh.mjs --only=sales

      - name: Refresh TRANSFERS from Dune (twice weekly — Monday + Thursday)
        # Transfers drive holder age, concentration, holder flow and the skyline. Nothing
        # free covers those, so this is the half that gets the extra run.
        if: steps.dow.outputs.day == '1' || steps.dow.outputs.day == '4' || github.event_name == 'workflow_dispatch'
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          AEON_TRANSFERS_QUERY_ID: ${{ vars.AEON_TRANSFERS_QUERY_ID }}   # optional (else created + logged)
        run: node scripts/build-aeon-dune-refresh.mjs --only=transfers
      - name: Rebuild transfer + sales reconstructions
        # onchain (holders/HODL-age/concentration/flow/skyline) + sales (floor/volume) from the
        # freshly-pulled CSVs. SPX balances stay the committed set (refreshed occasionally).
        run: |
          node scripts/build-aeon-onchain.mjs --transfers=dune/out/aeon_transfers.csv --spx=dune/out/aeon_spx_balances.csv
          node scripts/build-aeon-sales.mjs --sales=dune/out/aeon_sales.csv
      - name: Rebuild Aeon market valuation + trader P&L (keyless)
        # MVRV / supply-in-profit / URPD / deals / biggest sales / trait premiums, and the
        # wallet P&L leaderboard — from dune/out/*.csv + rarity + the live floor. No key.
        run: |
          node scripts/build-aeon-market.mjs
          node scripts/build-aeon-traders.mjs
      - name: Commit if changed
        id: commit
        run: |
          # Deploy only for DATA the site serves. aeon-sale-state.json and post-state.json
          # are runtime bookkeeping (deploy-ignored) — they must still be committed so the
          # sale watcher remembers what it posted and its lane survives to the next run,
          # but on their own they should not spend a Vercel deploy.
          DEPLOY_CHANGED=""
          DATA_CHANGED="$(git status --porcelain public/aeon*.json | grep -v 'aeon-sale-state.json' || true)"
          [[ -n "$DATA_CHANGED" ]] && DEPLOY_CHANGED=1
          if [[ -n "$(git status --porcelain public/aeon*.json public/post-state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/aeon*.json public/post-state.json
            git commit -m "chore: aeon banker $(date -u +%F)"
            git push
          else
            echo "No change to commit"
          fi
          # GITHUB_TOKEN commits can't trigger deploy.yml (recursion guard) → signal below.
          [[ -n "$DEPLOY_CHANGED" ]] && echo "deploy=true" >> "$GITHUB_OUTPUT" || echo "deploy=false" >> "$GITHUB_OUTPUT"

  # Redeploy so the fresh aeon.json reaches the site (charts + freshness tag).
  # Mirrors snapshot.yml's deploy job; shares the vercel-production concurrency group.
  deploy:
    needs: aeon
    if: needs.aeon.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
