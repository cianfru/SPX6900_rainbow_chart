name: Project Aeon NFT banker

on:
  schedule:
    - cron: "37 1 * * *"   # ~01:37 UTC daily (after the supply snapshot)
  workflow_dispatch: {}     # allow manual runs

permissions:
  contents: write

concurrency:
  group: aeon-banker
  cancel-in-progress: false

jobs:
  aeon:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Bank Aeon floor / owners / supply (Alchemy NFT API)
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          ALCHEMY_NETWORK: ${{ vars.ALCHEMY_NETWORK }}   # optional (default eth-mainnet)
          AEON_CONTRACT: ${{ vars.AEON_CONTRACT }}        # optional override
        run: node scripts/build-aeon.mjs
      - name: Compute trait rarity (once — traits are immutable)
        # Skips automatically if public/aeon-rarity.json already exists (add --force to re-pull).
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          ALCHEMY_NETWORK: ${{ vars.ALCHEMY_NETWORK }}
          AEON_CONTRACT: ${{ vars.AEON_CONTRACT }}
        run: node scripts/build-aeon-rarity.mjs
      - name: Fetch active listings × rarity (OpenSea)
        # Soft-skips without OPENSEA_KEY. Daily — listings change constantly.
        env:
          OPENSEA_KEY: ${{ secrets.OPENSEA_KEY }}
          AEON_CONTRACT: ${{ vars.AEON_CONTRACT }}
          AEON_OS_SLUG: ${{ vars.AEON_OS_SLUG }}       # optional (else resolved from the contract)
        run: node scripts/build-aeon-listings.mjs
      - name: Alert on interesting AEON listings (Telegram)
        # Reads the just-pulled listings + fair model and pings Telegram ONLY when something is
        # priced at/under fair value (a real buy on a thin market). Dedups; silent otherwise.
        # No always-on process — rides this daily cron. Repo var AEON_ALERT_DRY=1 = watch-only.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AEON_ALERT_TOL: ${{ vars.AEON_ALERT_TOL }}          # optional (default 0.10)
          AEON_ALERT_MINDISC: ${{ vars.AEON_ALERT_MINDISC }}  # optional (default 0.20)
          AEON_ALERT_DRY: ${{ vars.AEON_ALERT_DRY }}
          AEON_CONTRACT: ${{ vars.AEON_CONTRACT }}
        run: node scripts/aeon-listing-alert.mjs
      # COST (corrected 2026-07-26): the 2026-07-25 "0.54 credits/refresh" measurement read
      # executionCostCredits ONLY — the QUERY EXECUTION line. It MISSED Dune's separate "API
      # Result Read" charge, which bills the RESULT DOWNLOAD by datapoints. Re-downloading the
      # whole 25,289-row transfer + 17,040-row sales history every day cost ~62 + ~73 = ~135
      # credits/day (~4,050/mo — OVER the 2,500 quota), almost all of it in that result read.
      # build-aeon-dune-refresh.mjs is now INCREMENTAL: the full history is committed in
      # dune/out/*.csv, so it pulls only rows since the archive's last day (a handful) and
      # merges → the result read drops to ~0 credits. Daily is fine again. Lesson: measure the
      # API Result Read too, not just executionCostCredits.
      # ⭐ TRANSFERS NOW COME FROM ALCHEMY, NOT DUNE (2026-08-20). The Dune account was
      # suspended, freezing the whole holder-analytics half (age/concentration/flow/owners/
      # timeline/skyline) at 2026-07-23. Alchemy getAssetTransfers returns the same from/to/
      # tokenId/time and we already pay for the key, so it is the single source for AEON
      # transfers now. Full-history pull each run (~26 pages); soft-fails + never truncates.
      - name: Refresh AEON transfers from Alchemy (replaces the Dune transfers pull)
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          ALCHEMY_NETWORK: ${{ vars.ALCHEMY_NETWORK }}   # optional (default eth-mainnet)
          AEON_CONTRACT: ${{ vars.AEON_CONTRACT }}
        run: node scripts/build-aeon-transfers-alchemy.mjs

      # SALES (with prices) are the ONE remaining Dune dependency — they feed trader P&L / MVRV /
      # realized price, which Alchemy can't reconstruct historically (getNFTSales is a recent
      # window + deprecates 2026-09-30). This soft-fails while the account is suspended, leaving
      # the committed sales CSV frozen at 2026-07-23 (surfaced honestly by the freshness audit).
      # Migrate to a free BigQuery sales pull to drop Dune entirely.
      - name: Refresh AEON sales from Dune (sales only — the one remaining Dune feed)
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          AEON_SALES_QUERY_ID: ${{ vars.AEON_SALES_QUERY_ID }}           # optional (else created + logged)
        run: node scripts/build-aeon-dune-refresh.mjs

      - name: Rebuild transfer + sales reconstructions
        # onchain (holders/HODL-age/concentration/flow/skyline) + sales (floor/volume) from the
        # freshly-pulled CSVs. SPX balances stay the committed set (refreshed occasionally).
        run: |
          node scripts/build-aeon-onchain.mjs --transfers=dune/out/aeon_transfers.csv --spx=dune/out/aeon_spx_balances.csv
          node scripts/build-aeon-sales.mjs --sales=dune/out/aeon_sales.csv
          node scripts/build-city-timeline.mjs --aeon=dune/out/aeon_transfers.csv --out=public/aeon-timeline.json
      - name: Rebuild Aeon market valuation + trader P&L (keyless)
        # MVRV / supply-in-profit / URPD / deals / biggest sales / trait premiums, and the
        # wallet P&L leaderboard — from dune/out/*.csv + rarity + the live floor. No key.
        run: |
          node scripts/build-aeon-market.mjs
          node scripts/build-aeon-traders.mjs
      - name: Refresh ENS names for displayed wallets (cached, incremental)
        continue-on-error: true
        run: node scripts/build-ens.mjs --limit=600
      - name: Whale watch (both tracks — writes candidates, posts nothing)
        continue-on-error: true
        run: node scripts/bot/whale-watch.mjs
      - name: Commit if changed
        id: commit
        run: |
          # Deploy only for DATA the site serves. aeon-sale-state.json and post-state.json
          # are runtime bookkeeping (deploy-ignored) — they must still be committed so the
          # sale watcher remembers what it posted and its lane survives to the next run,
          # but on their own they should not spend a Vercel deploy.
          DEPLOY_CHANGED=""
          # aeon-sale-state.json (post bookkeeping) + aeon-dune-status.json (the Dune-pull heartbeat
          # the feed audit reads) are not site data — commit them, but don't spend a deploy on them.
          # ens.json (wallet name labels the skyline serves) IS site data — build-ens rewrites it
          # each run, so stage it too or the freshly-resolved names are thrown away every day.
          DATA_CHANGED="$(git status --porcelain public/aeon*.json public/ens.json | grep -vE 'aeon-sale-state.json|aeon-dune-status.json|aeon-listing-alert-state.json' || true)"
          [[ -n "$DATA_CHANGED" ]] && DEPLOY_CHANGED=1
          if [[ -n "$(git status --porcelain public/aeon*.json public/ens.json public/post-state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/aeon*.json public/ens.json public/post-state.json
            git commit -m "chore: aeon banker $(date -u +%F)"
            git push || { for i in 1 2 3 4 5; do echo "push rejected, rebasing (attempt $i)"; git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" && git push && break; sleep $((i*3)); done; }
          else
            echo "No change to commit"
          fi
          # GITHUB_TOKEN commits can't trigger deploy.yml (recursion guard) → signal below.
          [[ -n "$DEPLOY_CHANGED" ]] && echo "deploy=true" >> "$GITHUB_OUTPUT" || echo "deploy=false" >> "$GITHUB_OUTPUT"

  # Redeploy so the fresh aeon.json reaches the site (charts + freshness tag).
  # Mirrors snapshot.yml's deploy job; shares the vercel-production concurrency group.
  deploy:
    needs: aeon
    if: needs.aeon.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
