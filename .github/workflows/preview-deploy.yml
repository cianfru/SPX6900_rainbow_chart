name: Preview Deploy

# Builds the current branch and ships it to Vercel as a PREVIEW deployment
# (a unique throwaway URL — does NOT touch production). Trigger manually from
# the Actions tab; the preview URL is printed in the job summary.
# Reuses the same three secrets as the production deploy.

on:
  workflow_dispatch: {}

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings (preview)
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build (preview)
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview & print URL
        run: |
          URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "Preview deployment: $URL"
          {
            echo "### 🔎 Preview ready"
            echo ""
            echo "- App: $URL"
            echo "- BTC analog explorer: $URL/#btc-explorer"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
