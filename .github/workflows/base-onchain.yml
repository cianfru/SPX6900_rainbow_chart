name: Daily SPX-on-Base refresh (Blockscout ≥5k snapshot)

# The Base sibling of solana-onchain.yml. Base's ~114k headcount is ~99% airdrop dust — only ~800
# wallets hold ≥5k — so instead of a 6M-transfer pull we snapshot the ≥5k cohort straight from
# Blockscout's holders endpoint (balances sorted DESC, page until below the bar, ~16 pages), keyless
# and dust-immune. Appends today's snapshot to the committed archive (dune/out/spx6900_base_balances.csv)
# and reconstructs residents. CURRENT membership = today's snapshot; holder AGE = first ≥5k day in the
# archive (accruing forward until the one-time targeted history seed backfills real ages).
#
# ZERO credits (no Dune, no key). The archive is committed (small — ~800 rows/day, like Solana).
# 🔲 The daily feed gives forward-only ages; run the targeted ≥5k history seed once for back-dated ages.

on:
  schedule:
    - cron: "51 5 * * *"   # ~05:51 UTC daily (after solana-onchain at 05:41)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: base-onchain
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Snapshot ≥5k holders (Blockscout) → merge → rebuild residents
        run: node scripts/build-base-snapshot.mjs --out=public/base-onchain.json

      - name: Sanity check
        run: |
          node -e '
            const d=JSON.parse(require("fs").readFileSync("public/base-onchain.json","utf8"));
            const n=d.wallets.length; console.log("residents:",n,"| excluded:",d.excluded,"| updated:",d.updated);
            if(!(n>200&&n<5000)){console.error("resident count off — expected ~800");process.exit(1);}
          '

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain public/base-onchain.json dune/out/spx6900_base_balances.csv)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/base-onchain.json dune/out/spx6900_base_balances.csv
            git commit -m "chore: base on-chain refresh $(date -u +%F) [skip deploy]"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push rejected (attempt $i) — rebasing on the latest main and retrying"
              git pull --rebase --autostash origin main || exit 1
              sleep $((i * 3))
            done
          else
            echo "No change to commit"
          fi
