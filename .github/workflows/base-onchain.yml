name: Daily SPX-on-Base cohort refresh (Alchemy)

# The Base sibling of solana-onchain.yml / onchain-dune.yml. Keeps the Alchemy ≥5k COHORT current
# (dune/out/spx6900_base_cohort.csv: address, balance, status, first_5k_day, since_5k_day, exit_day) —
# the authoritative Alchemy transfer reconstruction: holders + everyone who ever crossed 5k and left,
# with real ages/exits/survival (full ETH/Solana parity). Each run pulls the transfer DELTA since the
# cohort's lastBlock via alchemy_getAssetTransfers, replays it onto per-wallet balances, updates the
# cohort (new crossings, exits), and regenerates public/base-onchain.json.
#
# SELF-SEEDING: the first run (cohort has no '# lastBlock=' header) FAST-SEEDS — it stamps
# lastBlock = the chain head and trusts the committed Alchemy CSV (no 6M-transfer re-pull, so it can't
# OOM/time out). Every run after is a cheap daily delta. Dispatch with full=true occasionally for an
# exact streaming rebuild that heals the narrow sub-5k-accumulator seam gap.
# NEEDS: ALCHEMY_KEY (the AEON key). No key → soft-skip (no write). The Blockscout snapshot
# (build-base-snapshot.mjs) stays as a keyless fallback.

on:
  # Daily collection DISABLED 2026-08-04. The per-wallet Base reconstruction is thin (~400 real wallets;
  # Wormhole-bridged, so no honest cost basis) and tells the same shape of story as the ETH engine while
  # adding a fragile daily dependency (Alchemy). ETH deep on-chain (onchain-dune.yml) + the cheap
  # multi-chain HEADCOUNT (in snapshot.yml) stay. Kept as workflow_dispatch for a manual refresh if wanted.
  # schedule:
  #   - cron: "51 5 * * *"   # ~05:51 UTC daily (after solana-onchain at 05:41)
  workflow_dispatch:
    inputs:
      full:
        description: "Force a full rebuild from genesis (weekly self-heal / reseed)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: base-onchain
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Alchemy delta → replay → update cohort → rebuild base-onchain.json
        env:
          ALCHEMY_KEY: ${{ secrets.ALCHEMY_KEY }}
          NODE_OPTIONS: --max-old-space-size=4096   # headroom for a --full streaming rebuild
        run: node scripts/build-base-alchemy.mjs ${{ (github.event.inputs.full == 'true') && '--full' || '' }}

      - name: Sanity check
        run: |
          node -e '
            const d=JSON.parse(require("fs").readFileSync("public/base-onchain.json","utf8"));
            console.log("holders:",d.holders,"| exited:",d.exited,"| survival:",d.survivalPct+"% | updated:",d.updated);
            if(!(d.holders>200&&d.holders<3000)){console.error("holder count off — expected ~500");process.exit(1);}
          '

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain public/base-onchain.json dune/out/spx6900_base_cohort.csv)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/base-onchain.json dune/out/spx6900_base_cohort.csv
            git commit -m "chore: base cohort refresh $(date -u +%F) [skip deploy]"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push rejected (attempt $i) — rebasing on the latest main and retrying"
              git pull --rebase --autostash origin main || exit 1
              sleep $((i * 3))
            done
          else
            echo "No change to commit"
          fi
