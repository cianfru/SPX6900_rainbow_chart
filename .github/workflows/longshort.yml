# FOUNDATION: bank Binance futures Long/Short positioning for SPX6900 daily into
# public/longshort.json (it only serves ~30 days, so we accumulate). Runs in CI
# because the exchange APIs aren't reachable from the dev sandbox. The chart fills
# in as history banks. Set repo var BINANCE_LS_SYMBOL if the perp isn't "SPXUSDT".
name: Build long/short
on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"   # daily 07:23 UTC
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Bank Bybit L/S + Hyperliquid funding/OI
        env:
          BYBIT_LS_SYMBOL: ${{ vars.BYBIT_LS_SYMBOL }}
          HL_COIN: ${{ vars.HL_COIN }}
        run: node scripts/build-longshort.mjs
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain public/longshort.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/longshort.json
            git commit -m "chore: bank long/short ratios"
            git push
          else
            echo "no change"
          fi
