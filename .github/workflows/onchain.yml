# AUTOMATED REFRESH of the on-chain valuation & distribution series (Supply in Profit %,
# concentration, gini, HODL waves). Re-executes the self-sufficient Stage-2 Dune query via
# the API and writes public/onchain.json, then redeploys so the live site + og card pick it
# up (a GITHUB_TOKEN commit alone can't trigger deploy.yml — GitHub's recursion guard). The
# heavy Dune query is ~50 credits/run, so WEEKLY keeps it a small slice of the 2,500/mo free
# budget. Needs the DUNE_API_KEY repo secret (+ Vercel env for the live og render).
name: Refresh on-chain series
on:
  workflow_dispatch:
  schedule:
    - cron: "37 7 * * 1"   # 07:37 UTC every Monday (after the week's Monday closes)
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Fetch on-chain series from Dune
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DUNE_ONCHAIN_QUERY_ID: ${{ vars.DUNE_ONCHAIN_QUERY_ID }}
        run: node scripts/build-onchain.mjs
      - name: Commit if changed
        id: commit
        run: |
          if [[ -n "$(git status --porcelain public/onchain.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/onchain.json
            git commit -m "chore: refresh on-chain series"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # the just-pushed onchain commit (not the trigger SHA)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
