name: Deploy to Vercel

# Builds on GitHub's runners and ships the prebuilt output to Vercel via the CLI,
# bypassing Vercel's own (queued) build pipeline. Requires three repo secrets:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

on:
  push:
    branches: [main]
    # Bot runtime-state commits shouldn't trigger a redeploy — they're read at
    # workflow runtime (the bot) or via raw.githubusercontent (the control panel),
    # NOT from the deployed site. Without this the hourly band-watch state commit
    # would deploy every hour and blow Vercel's free 100-deploys/day limit.
    paths-ignore:
      - "CLAUDE.md"
      - "dune/**"
      - "flipside/**"
      - "public/next-post.json"
      - "public/post-state.json"
      - "public/band-state.json"
      - "public/daily-band-state.json"
      - "public/milestone-state.json"
      - "public/post-copy.json"
      - "public/card-ar.json"
      - "public/recap-pending.json"
      - "public/signals.json"
  workflow_dispatch: {}

# Cancel an in-flight deploy if a newer commit lands, so the queue can never pile up.
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build (frontend + api functions)
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
