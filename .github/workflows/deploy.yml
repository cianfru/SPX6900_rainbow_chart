name: Deploy to Vercel

# Builds on GitHub's runners and ships the prebuilt output to Vercel via the CLI,
# bypassing Vercel's own (queued) build pipeline. Requires three repo secrets:
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

on:
  push:
    branches: [main]
    # Bot runtime-state commits shouldn't trigger a redeploy — they're read at
    # workflow runtime (the bot) or via raw.githubusercontent (the control panel),
    # NOT from the deployed site. Without this the hourly band-watch state commit
    # would deploy every hour and blow Vercel's free 100-deploys/day limit.
    paths-ignore:
      - "CLAUDE.md"
      - "design/**"
      - "dune/**"
      - "flipside/**"
      - "public/next-post.json"
      - "public/post-state.json"
      - "public/band-state.json"
      - "public/daily-band-state.json"
      - "public/milestone-state.json"
      - "public/post-copy.json"
      - "public/card-ar.json"
      - "public/recap-pending.json"
      - "public/rotation-excludes.json"
      - "public/signals.json"
      - "public/aeon-sale-state.json"
      - "public/whale-signals.json"
      - "public/whale-state.json"
      - "public/aeon-live-sales.json"
      - "public/feed-health.json"
  workflow_dispatch: {}

# Cancel an in-flight deploy if a newer commit lands, so the queue can never pile up.
concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    # Opt OUT of a deploy for work-in-progress pushes: put [skip deploy] anywhere in the commit
    # message and this job is skipped entirely (0 runner minutes, no Vercel deployment created), so a
    # heavy dev burst no longer spends one of Vercel's 100 daily deploys — nor a GitHub Actions
    # minute — on every intermediate commit. The final, UNFLAGGED "ship it" commit deploys as normal,
    # and a manual "Run workflow" (workflow_dispatch) always deploys. GitHub's native [skip ci] also
    # works and skips the whole run, but it's broader (suppresses every workflow on that push).
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build (frontend + api functions)
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # WHY vercel.json PINS s-maxage=0 ON THE HTML AND JSON (the reasoning cannot live in
      # vercel.json — its schema rejects unknown keys, including a "//" comment):
      # Vercel was holding `/` at the edge for the better part of an hour, measured on the
      # live domain as x-vercel-cache: HIT with age 3409. A query string is not part of the
      # cache key for a static file, so a stale entry survives both a hard refresh and a
      # manual cache-buster. And because the shell names the content-hashed bundle, and old
      # hashed assets stay served, ONE stale copy of index.html hands back a complete and
      # perfectly coherent old app. max-age=0 only governs the browser; s-maxage=0 is what
      # tells the CDN to revalidate. /assets/* is deliberately left cacheable — it is
      # content-addressed, so it is safe forever and it is where the caching actually pays.
      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify the live domain is serving this commit
        # A green deploy step only proves Vercel accepted the upload. It does not prove the
        # production alias moved, and "the site is stale while the deploy says success" has
        # come up more than once. The build stamps its commit into /version.json, so this
        # asks the real domain what it is serving and fails if it is not this build —
        # turning a silent alias problem into a red X instead of a puzzle days later.
        run: |
          WANT="${GITHUB_SHA:0:7}"
          echo "expecting sha $WANT at https://spx6900rainbow.xyz/version.json"
          for i in $(seq 1 12); do
            GOT=$(curl -fsS --max-time 10 "https://spx6900rainbow.xyz/version.json?cb=$RANDOM" 2>/dev/null \
                  | sed -n 's/.*"sha": *"\([^"]*\)".*/\1/p')
            if [ "$GOT" = "$WANT" ]; then echo "✓ live domain is serving $GOT"; exit 0; fi
            echo "  attempt $i: live=${GOT:-<none>} want=$WANT — waiting"
            sleep 10
          done
          echo "::error::The deploy succeeded but https://spx6900rainbow.xyz is still serving '${GOT:-<nothing>}' instead of $WANT after ~2 minutes."
          echo "The upload worked, so the alias or the edge cache is the suspect — check the Vercel dashboard for which deployment holds the production alias."
          exit 1
